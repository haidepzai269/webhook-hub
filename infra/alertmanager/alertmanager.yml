# MON1 (ADR-249). Receiver CHƯA chốt: Admin đang chọn email / Telegram bot / SMS.
# `default` hiện chỉ gửi webhook tới alert-sink (container echo, xem log: docker logs webhook-hub-alert-sink)
# để luồng Prometheus -> Alertmanager -> receiver chạy thật mà không cần secret.
# KHÔNG đặt token/mật khẩu thật vào file này (file nằm trong git). Khi chốt receiver: dùng `bot_token_file`/
# `auth_password_file` trỏ tới file secret mount từ ngoài repo.
route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: Watchdog luôn bắn, gửi đều tới receiver riêng (không lẫn cảnh báo thật).
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-sink:8080/alertmanager
        send_resolved: true

  # Local: chỉ chứng minh đường ống thông. Thật: kênh NGOÀI (Healthchecks.io, ping mỗi 5 phút; thiếu ping -> họ báo).
  # Prometheus/Alertmanager chết thì chỉ kênh ngoài báo được. URL ping chứa token -> để trong file, KHÔNG vào repo.
  - name: watchdog
    webhook_configs:
      - url: http://alert-sink:8080/watchdog
        send_resolved: false
        # url_file: /etc/alertmanager/secrets/healthchecks_url   # thay `url` khi nối Healthchecks.io

  # --- Chừa chỗ (bỏ comment + đổi route.receiver khi chốt) ---
  # - name: telegram
  #   telegram_configs:
  #     # Bật Telegram/email: thêm vào service alertmanager (docker-compose.yml)
  #     #   volumes: - ./infra/alertmanager/secrets:/etc/alertmanager/secrets:ro   (thư mục này PHẢI nằm trong .gitignore)
  #     - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token   # file ngoài repo
  #       chat_id: 0                                                     # số chat id thật
  #       parse_mode: HTML
  #       send_resolved: true
  # - name: email
  #   email_configs:
  #     - to: 'ops@example.com'
  #       from: 'alert@example.com'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alert@example.com'
  #       auth_password_file: /etc/alertmanager/secrets/smtp_password    # file ngoài repo
  #       send_resolved: true
  # SMS: Alertmanager không có receiver SMS gốc -> đi qua webhook_configs tới cổng SMS (eSMS/Twilio...) hoặc relay.

# TargetDown che luật con cùng job (chết hẳn thì không cần báo thêm "im"/"không consumer").
inhibit_rules:
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname=~"WorkerSilent|WorkerHeartbeatMissing|RabbitNoConsumers|RabbitQueueMissing"']
    equal: ['job']
  # Dự báo đầy trong 24 giờ (critical) che dự báo 7 ngày (warning) của cùng ổ.
  - source_matchers: ['alertname="DiskWillFillIn24Hours"']
    target_matchers: ['alertname="DiskWillFillIn7Days"']
    equal: ['mountpoint', 'instance']
  - source_matchers: ['alertname="HostMemoryCritical"']
    target_matchers: ['alertname="HostMemoryHigh"']
    equal: ['instance']
