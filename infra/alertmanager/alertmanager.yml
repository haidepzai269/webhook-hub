# MON1 (ADR-249) + Telegram local (ADR-257).
# `default` luôn gửi webhook tới alert-sink (container echo: docker logs webhook-hub-alert-sink) để luồng
# Prometheus -> Alertmanager -> receiver chạy thật mà không cần secret.
# Telegram: file này là TEMPLATE. entrypoint.sh (mount vào container) đọc infra/alertmanager/secrets/telegram_bot_token
# + telegram_chat_id (gitignored); đủ cả hai thì giữ các khối TELEGRAM (điền chat_id), thiếu thì CẮT chúng đi
# -> Alertmanager vẫn lên, chỉ còn alert-sink. KHÔNG đặt token/chat_id thật vào file này (file nằm trong git).
route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: Watchdog luôn bắn, gửi đều tới receiver riêng (không lẫn cảnh báo thật).
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m
    # TELEGRAM-ROUTE-BEGIN
    # Cảnh báo thật (warning/critical) -> Telegram, rồi `continue` để vẫn rơi xuống default/alert-sink.
    # Watchdog đã bị route trên chặn (không continue) và severity=none không khớp -> không bao giờ tới Telegram.
    - matchers: ['severity=~"warning|critical"']
      receiver: telegram
      continue: true
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          repeat_interval: 1h
    # TELEGRAM-ROUTE-END
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-sink:8080/alertmanager
        send_resolved: true

  # Local: chỉ chứng minh đường ống thông. Thật: kênh NGOÀI (Healthchecks.io, ping mỗi 5 phút; thiếu ping -> họ báo).
  # Prometheus/Alertmanager chết thì chỉ kênh ngoài báo được. URL ping chứa token -> để trong file, KHÔNG vào repo.
  - name: watchdog
    webhook_configs:
      - url: http://alert-sink:8080/watchdog
        send_resolved: false
        # url_file: /etc/alertmanager/secrets/healthchecks_url   # thay `url` khi nối Healthchecks.io

  # TELEGRAM-RECEIVER-BEGIN
  # Bật: Admin tự chép token + chat_id vào infra/alertmanager/secrets/ (xem *.example, docs/MONITORING.md §4).
  # parse_mode mặc định của Alertmanager là HTML và nó tự escape giá trị template ("<7 ngày" -> "&lt;7 ngày"), nên an toàn.
  # Giờ hiển thị theo UTC (template Alertmanager không đổi múi giờ được).
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 1 # @CHAT_ID@
        send_resolved: true
        message: |-
          {{ if eq .Status "firing" }}[ĐANG BÁO] {{ .Alerts.Firing | len }} cảnh báo{{ else }}[ĐÃ HẾT] {{ .Alerts.Resolved | len }} cảnh báo{{ end }}
          {{ range .Alerts }}
          {{ if eq .Status "firing" }}[ĐANG BÁO]{{ else }}[ĐÃ HẾT]{{ end }} {{ .Labels.alertname }} - mức: {{ .Labels.severity }}
          {{ if .Annotations.summary }}Tóm tắt: {{ .Annotations.summary }}
          {{ end }}{{ if .Annotations.description }}Mô tả: {{ .Annotations.description }}
          {{ end }}Từ: {{ .StartsAt.Format "15:04:05 02/01/2006" }} UTC{{ if eq .Status "resolved" }} đến {{ .EndsAt.Format "15:04:05 02/01/2006" }} UTC{{ end }}
          {{ end }}
          Grafana: http://localhost:3001
          Alertmanager: http://localhost:9093
  # TELEGRAM-RECEIVER-END

  # --- Chừa chỗ ---
  # - name: email
  #   email_configs:
  #     - to: 'ops@example.com'
  #       from: 'alert@example.com'
  #       smarthost: 'smtp.example.com:587'
  #       auth_username: 'alert@example.com'
  #       auth_password_file: /etc/alertmanager/secrets/smtp_password    # file ngoài repo
  #       send_resolved: true
  # SMS: Alertmanager không có receiver SMS gốc -> đi qua webhook_configs tới cổng SMS (eSMS/Twilio...) hoặc relay.

# TargetDown che luật con cùng job (chết hẳn thì không cần báo thêm "im"/"không consumer").
# Chỉ WorkerSilent/RabbitNoConsumers mang nhãn `job`. WorkerHeartbeatMissing/RabbitQueueMissing dùng absent() nên KHÔNG có nhãn job:
# inhibit không khớp chúng; không hại vì chính điều kiện `up == 1` của chúng đã loại trừ ca target chết.
inhibit_rules:
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname=~"WorkerSilent|RabbitNoConsumers"']
    equal: ['job']
  # Dự báo đầy trong 24 giờ (critical) che dự báo 7 ngày (warning) của cùng ổ.
  - source_matchers: ['alertname="DiskWillFillIn24Hours"']
    target_matchers: ['alertname="DiskWillFillIn7Days"']
    equal: ['mountpoint', 'instance']
  - source_matchers: ['alertname="HostMemoryCritical"']
    target_matchers: ['alertname="HostMemoryHigh"']
    equal: ['instance']
