# Cấu hình gitleaks cho repo (CI job `secrets`, SPEC-verification §7.1).
# Giữ nguyên toàn bộ luật mặc định, chỉ bỏ qua các chuỗi MẪU đã kiểm là không phải bí mật thật.
# Thêm dòng mới vào allowlist phải ghi lý do; secret thật bị lộ thì XOAY ở provider, không allowlist.

[extend]
useDefault = true

[allowlist]
description = "Chuỗi mẫu trong spec/test, không phải secret thật"
regexes = [
  # SPEC-dev-experience.md: secret ví dụ dạng Standard Webhooks; base64 giải ra "testtesttest…".
  '''whsec_dGVzdHRlc3R0ZXN0[A-Za-z0-9+/=]*''',
  # SPEC-hub-multi-service.md T9: secret của "ngân hàng giả" trong kịch bản curl.
  '''bank_secret_123''',
  # Vector chuẩn công khai trong README của repo standard-webhooks (U6).
  '''whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw''',
  # .env.verify: mọi secret của stack hubv là giá trị giả có tiền tố này (SPEC-verification §4.2).
  '''VERIFY_ONLY_[A-Za-z0-9_\-]*''',
  # Dữ liệu giả trong test (đã xác minh 2026-10-11, không phải secret thật): chuỗi tuần tự / base64 của mô tả test.
  # libs/common/test/auth-common.spec.ts — secret CSRF giả.
  '''csrf-secret-0123456789-0123456789-abc''',
  # apps/hub-api/test/service-resources.spec.ts — base64 của "sai-secret-cua-key-moi-test" / "new-secret-for-ms-r4-test".
  '''whsec_c2FpLXNlY3JldC1jdWEta2V5LW1vaS10ZXN0''',
  '''whsec_bmV3LXNlY3JldC1mb3ItbXMtcjQtdGVzdA==''',
  # libs/database/test/seed-env.spec.ts, libs/hub-sdk/test/sdk.spec.ts — API key giả dạng bảng chữ cái tuần tự.
  '''hk_(test|live)_abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG''',
  # apps/hub-api/test/service-sources.spec.ts — API key SePay giả.
  '''apikey_123456''',
  # apps/shop/test/settings.spec.ts (SK2) — khoá PayOS giả dạng "<tên>-0123456789-SECRET" (đã xác minh 2026-10-12).
  '''(cid|apikey|checksum)-0123456789-SECRET''',
  # libs/providers/test/canonical-github.spec.ts (ADR-162) — secret HMAC giả của fixture webhook GitHub (đã xác minh 2026-10-12).
  '''gh-secret-adr162''',
  # libs/common/test/alert-email.spec.ts (CB:T9, ADR-173) — chuỗi ĐÁNH DẤU giả để test khẳng định secret trong facts KHÔNG
  # lọt vào email cảnh báo (đã xác minh 2026-10-12, không phải secret thật).
  '''whsec_SECRET789''',
  # libs/providers/test/generic-signed-template.spec.ts (review PK3 T-4) — vector CÔNG KHAI trong tài liệu Slack
  # (docs.slack.dev/authentication/verifying-requests-from-slack): signing secret, token slash-command và chữ ký mẫu
  # (đã xác minh 2026-10-14: HMAC của secret mẫu trên chuỗi mẫu ra đúng chữ ký mẫu; không phải khoá thật).
  '''8f742231b10e8888abcd99yyyzzz85a5''',
  '''xyzz0WbapA4vBCDEFasx0q6G''',
  '''a2114d57b48eac39b9ad189dd8316235a7b4a8d21a10bd27519666489c69b503''',
  # apps/catchnet/test/*.spec.ts (LH2) — secret chuyển tiếp và admin token GIẢ của Worker trong vitest, dạng
  # "lh2-test-<tên>-0123456789abcdef" (đã xác minh 2026-10-15, không phải secret thật).
  '''lh2-test-[a-z-]+-0123456789abcdef(-x)?''',
  # apps/hub-api/test/log-landmine.spec.ts (LOGGING.md §5, ADR-254) — API key GIẢ dùng làm "mìn" để khẳng định log KHÔNG
  # lộ key (chứa chữ MINE; đã xác minh 2026-10-18, không phải khoá thật).
  '''hk_live_MINEKEYMINEKEY1234567890''',
  # apps/web/src/lib/sentry/scrub.spec.ts (ADR-264, test không-lọt §11.9e) — "mìn" GIẢ để khẳng định scrub che hết:
  # bảng chữ cái tuần tự, sk_live_ toàn "x", JWT mẫu công khai của jwt.io (sub "1234567890"), giá trị VIẾT HOA tự đặt
  # (đã xác minh 2026-10-19, không phải secret thật).
  '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',
  '''hk_(test|live)_ABCDEFGHIJKLMNOP12345678''',
  '''hk_test_zyxwvutsrqponm98765432''',
  '''sk_live_51Hx{10}ABCDEF''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N''',
  '''whsec_MfKQ9r8GKYqrTwjBfAbcdEFGH12345''',
  '''(SESSIONTOKENVALUE123|CSRFVALUE12345|s3cr3tPassw0rd!)''',
  # apps/web/src/lib/sentry/scrub.spec.ts (ADR-264, bổ sung) — khoá Google API GIẢ (chứa chữ FAKE) để test khẳng định
  # scrub che `AIza…` trước khi event rời trình duyệt (đã xác minh 2026-10-19, không phải khoá thật).
  '''AIzaSyBFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE''',
  # apps/web/scripts/overflow-audit.mjs (ADR-271) — keyPrefix GIẢ của API mock khi đo bảng Khoá API
  # (đã xác minh 2026-10-30, chuỗi gõ tay, không phải khoá thật).
  '''whk_live_ab12cd34''',
]
