# =====================================================================================
# VF1 (SPEC-verification §4.1, ADR-067): stack kiểm chứng `hubv`, CHỈ chứa phần GHI ĐÈ.
#
#   npm run verify:up     # docker compose -p hubv -f docker-compose.yml -f docker-compose.verify.yml --env-file .env.verify up -d --build --wait
#   npm run verify:down   # ... down -v  (xoá volume hubv_*, KHÔNG đụng volume của stack dev `webhook-hub`)
#
# Luật:
# - Cổng = cổng dev + 10000 để chạy song song với stack dev (postgres 15433, redis 16379,
#   rabbit 15673 (AMQP — 15672 trùng UI RabbitMQ của dev, lệch spec) / 25672 (UI), hub-api 14000, shop 14001).
# - `container_name: !reset null` — compose tự đặt tên `hubv-<service>-1`, không trùng `webhook-hub-*`.
#   Script verify KHÔNG BAO GIỜ gọi docker bằng tên container cứng, chỉ `docker compose -p hubv ...`.
# - `ports: !override` — mặc định compose GỘP danh sách ports của hai file (sẽ chiếm luôn 5433/4000 của dev).
# - Volume tên ngắn (`pgdata`...) được compose gắn tiền tố project → `hubv_pgdata`, mạng `hubv_default`.
# - Prometheus/Grafana chỉ chạy khi `VERIFY_WITH_METRICS=1` (profile `metrics`) để đỡ RAM.
# - web chỉ chạy khi `VERIFY_WITH_WEB=1` (profile `web`): bundle web nhúng HUB_API_URL lúc build
#   (mặc định localhost:4000 = API của stack DEV), nên chưa dùng được cho e2e của hubv. VF4 xử lý.
# - Mọi secret đến từ `.env.verify` (giá trị giả `VERIFY_ONLY_…`). TELEGRAM_BOT_TOKEN/DISCORD_WEBHOOK_URL
#   để TRỐNG → seed trỏ đích Telegram/Discord vào /mock/* của chính hub-api (ADR-054). `verify/cli/stack.ts`
#   từ chối chạy nếu hai biến này có giá trị.
# Cần Docker Compose ≥ 2.24 (tag `!reset` / `!override`).
# =====================================================================================
services:
  postgres:
    container_name: !reset null
    ports: !override
      - "15433:5432"

  redis:
    container_name: !reset null
    ports: !override
      - "16379:6379"

  rabbitmq:
    container_name: !reset null
    ports: !override
      - "15673:5672"
      - "25672:15672"

  rabbitmq-init:
    container_name: !reset null

  prometheus:
    container_name: !reset null
    profiles: ["metrics"]
    ports: !override
      - "19090:9090"

  grafana:
    container_name: !reset null
    profiles: ["metrics"]
    ports: !override
      - "13001:3000"

  hub-api:
    container_name: !reset null
    environment:
      - TRUST_PROXY=10.250.251.6
    ports: !override
      - "14000:4000"
    # AU2 (SPEC-verification §4.2): MAIL_DRIVER=capture ghi mỗi thư một file JSON -> runner e2e đọc link từ verify/.mail
    volumes:
      - ./verify/.mail:/mail

  hub-worker:
    container_name: !reset null
    # CB5: email cảnh báo của worker cũng ghi vào verify/.mail (driver capture) — CB:T9 quét thư.
    volumes:
      - ./verify/.mail:/mail

  shop:
    container_name: !reset null
    ports: !override
      - "14001:4001"

  web:
    container_name: !reset null
    profiles: ["web"]
    # Trình duyệt mở console hubv (:13000) phải nói chuyện với hub-api/shop của hubv (:14000/:14001) — socket realtime,
    # URL webhook hiển thị, Shop. Không đặt thì bundle nhúng localhost:4000 = stack dev (nhầm stack, hoặc không có ai).
    # Chỉ ảnh hưởng JS phía trình duyệt; e2e qua proxy web (/api, /auth) dùng HUB_API_INTERNAL_URL như cũ.
    build:
      args:
        NEXT_PUBLIC_HUB_API_URL: http://localhost:14000
        NEXT_PUBLIC_SHOP_API_URL: http://localhost:14001
    ports: !override
      - "13000:3000"

  # EG1 (ADR-175): cửa vào nginx của hubv (:18080 -> hub-api). Trần THẤP để [EG:T10] chạm cầu chì bằng vài chục request
  # (mặc định thật 50 r/s burst 500 kiểm ở L0). Không đổi service cũ: request không qua :18080 chạy như trước.
  edge:
    container_name: !reset null
    # Tên image cố định để edge-sink dùng CHUNG (không build hai lần).
    image: hubv-edge
    # Subnet riêng của hubv (khác stack dev 10.250.250.0/29) — khớp TRUST_PROXY của hub-api bên trên + ipam cuối file.
    networks: !override
      edge_net:
        ipv4_address: 10.250.251.6
    ports: !override
      - "18080:8080"
    environment:
      - PORT=8080
      - EDGE_UPSTREAM=hub-api:4000
      - EDGE_IP_FUSE=1
      - EDGE_IP_RATE=5
      - EDGE_IP_BURST=10
      - EDGE_CONN_PER_IP=50
      - EDGE_TRUSTED_PROXIES=

  # Chỉ hubv: cùng image + template nhưng upstream là sink -> [EG:T11]/[EG:T2] đọc lại ĐÚNG header/bytes nginx gửi lên.
  edge-sink:
    image: hubv-edge
    pull_policy: never
    restart: unless-stopped
    command: ["edge"]
    ports:
      - "18090:8080"
    environment:
      - PORT=8080
      - EDGE_UPSTREAM=sink:4100
      - EDGE_IP_FUSE=0
    stop_signal: SIGQUIT
    depends_on:
      edge:
        condition: service_started
      sink:
        condition: service_started

  # Chỉ có ở hubv: "service của dev" ở đầu nhận (DINH-CHINH-AUTH §8 #6). hub-worker gọi http://sink:4100/<path>.
  # Đọc lại request: GET http://localhost:14100/_requests. Không import code hub (tools/verify-sink/sink.js).
  sink:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /sink
    command: ["node", "server.js", "4100"]
    volumes:
      - ./tools/verify-sink:/sink:ro
    ports:
      - "14100:4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 10

# EG1: edge_net của hubv dùng subnet KHÁC stack dev (10.250.250.0/29) -> chạy song song không "Pool overlaps".
networks:
  edge_net:
    ipam: !override
      config:
        - subnet: 10.250.251.0/29
          ip_range: 10.250.251.0/30
