# VF7 (SPEC-verification §7, ADR-067): CI bắt buộc. Repo PUBLIC → không có secret thật nào ở đây; chỉ .env.verify.
#
# Job: unit (L0 + map + grep §7.3) · db (L1 trên service container) · secrets (gitleaks toàn lịch sử)
#      · e2e (L2 trên compose hubv, mọi push — VF8) · chaos (L3, nightly + bấm tay) · probe (verify:probe --all,
#      job RIÊNG, nightly + bấm tay, không phụ thuộc chaos — M-5).
# Bảo vệ nhánh (Admin bật trên GitHub): `unit` + `db` là required check để merge vào main.
name: verify

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**', '_bmad-output/**']
  # pull_request (KHÔNG pull_request_target): PR từ fork không đọc được secret nào. CI vốn không cần secret.
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '_bmad-output/**']
  workflow_dispatch:
  # VF8: chaos + probe chạy đêm (02:00 giờ Việt Nam).
  schedule:
    - cron: '0 19 * * *'

# M-5: lượt đêm (schedule) có nhóm riêng — push lúc đêm không huỷ chaos/probe đang chạy, và ngược lại.
# L-R2-6: bấm tay (workflow_dispatch, chạy chaos/probe tới 4 giờ) cũng nhóm riêng và không bị huỷ bởi push.
concurrency:
  group: verify-${{ github.ref }}-${{ (github.event_name == 'schedule' && 'nightly') || (github.event_name == 'workflow_dispatch' && 'manual') || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  unit:
    name: unit (L0 + map + gates)
    runs-on: ubuntu-24.04
    # 15 → 25 (2026-10-15): L0 đã chạm 13–14m45s (1970 test), run 38717026349 bị huỷ vì quá 15 phút, không phải test đỏ.
    timeout-minutes: 25
    env:
      # Ngoại lệ DUY NHẤT của luật --maxWorkers=2: runner CI có 4 vCPU / 16GB, máy dev thì không.
      VERIFY_JEST_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Grep gác cổng §7.3
        run: npm run verify:gates
      # EG1 (ADR-175): nginx THẬT cho [EG:T9]/[EG:T11] (phần d) — không có thì T9 chạy nginx giả, T11 (phần d) skip.
      # Review EG1 lượt 3 (Thấp-2): ảnh runner có sẵn nginx vẫn phải có envsubst (gettext-base); đường dẫn nginx lấy từ
      # máy, không viết cứng — thiếu thì bước này đỏ chứ không để T9/T11 (phần d) hỏng khó hiểu.
      - name: Cài nginx + envsubst (EG1)
        run: |
          if ! command -v nginx >/dev/null || ! command -v envsubst >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nginx gettext-base
          fi
          bin="$(command -v nginx)"
          test -x "$bin" && command -v envsubst
          echo "EDGE_NGINX_BIN=$bin" >> "$GITHUB_ENV"
      - name: L0 unit
        run: npm run verify:unit
      - name: verify:map (mồ côi / ma / trùng)
        run: npm run verify:map
      - name: Lưu TEST-MAP + kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit
          path: |
            docs/TEST-MAP.md
            verify/.results/
            verify/.last-red.json
          if-no-files-found: ignore
          include-hidden-files: true # verify/.results là thư mục ẩn — thiếu cờ này artifact rỗng và không đọc được test nào skip/fail

  # LH2 (SPEC-hub-sap H10, ADR-214): Worker lưới hứng `apps/catchnet` nằm NGOÀI npm workspaces (wrangler/workerd nặng,
  # không làm chậm `npm ci` của hub) -> lock riêng, job riêng. L0 = vitest trên Node (D1 giả bằng node:sqlite).
  # `[LH:T*]` của Worker được verify:map đọc (tên test), nhưng jest gốc không chạy chúng.
  catchnet:
    name: catchnet (Worker L0 + typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/catchnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/catchnet/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  db:
    name: db (L1)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub_user
          POSTGRES_PASSWORD: hub_password
          POSTGRES_DB: webhook_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hub_user -d webhook_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # AU6 (SPEC-verification §4.3): migrate/fixture bằng OWNER; code đang test bằng hub_app (RLS có hiệu lực).
      DATABASE_URL: postgresql://hub_user:hub_password@localhost:5432/webhook_hub?schema=hub
      DIRECT_URL: postgresql://hub_user:hub_password@localhost:5432/webhook_hub?schema=hub
      HUB_APP_DB_PASSWORD: ci_only_hub_app_password
      VERIFY_DATABASE_URL: postgresql://hub_app:ci_only_hub_app_password@localhost:5432/webhook_hub?schema=hub
      VERIFY_DB_OWNER_URL: postgresql://hub_user:hub_password@localhost:5432/webhook_hub?schema=hub
      VERIFY_REDIS_URL: redis://localhost:6379
      VERIFY_JEST_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Role runtime hub_app (không superuser, không BYPASSRLS) — AU6
        run: npm run ensure-app-role --workspace=libs/database
      - name: Migration thật (không db push — ADR-047) — cấp quyền hub_app + bật RLS
        run: npx prisma migrate deploy --schema=libs/database/prisma/schema.prisma
      - name: L1 db (skip > 0 = đỏ)
        run: npm run verify:db
      - name: Lưu kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-db
          path: |
            verify/.results/
            verify/.last-red.json
          if-no-files-found: ignore
          include-hidden-files: true # verify/.results là thư mục ẩn — thiếu cờ này artifact rỗng và không đọc được test nào skip/fail

  secrets:
    name: secrets (gitleaks, toàn lịch sử)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ghim phiên bản image. Có phát hiện → XOAY secret đó ở provider, không chỉ xoá khỏi git (§7.1).
      - name: gitleaks detect
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --redact --verbose --exit-code 1

  # VF8 (SPEC-verification §7.1): L2 — compose `hubv` trên runner ubuntu, kịch bản HTTP thật (đăng ký qua mail capture,
  # hub-sim, sink, auth-e2e). Repo public → runner chuẩn không giới hạn phút → chạy MỌI push.
  e2e:
    name: e2e (L2 trên hubv)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERIFY_WITH_WEB: '1' # kịch bản qua proxy web (AR:R-2, R-5, GO9) — không có web thì ∅ = SKIP = đỏ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: verify:up (build image + seed hubv)
        run: npm run verify:up
      - name: L2 e2e (skip > 0 = đỏ)
        run: npm run verify:e2e
      - name: Log + mail capture khi đỏ
        if: failure()
        run: docker compose -p hubv -f docker-compose.yml -f docker-compose.verify.yml --env-file .env.verify logs --no-color > hubv-logs.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-e2e
          path: |
            hubv-logs.txt
            verify/.mail/
            verify/.results/
          if-no-files-found: ignore
          include-hidden-files: true # verify/.results là thư mục ẩn — thiếu cờ này artifact rỗng và không đọc được test nào skip/fail

  # VF8: L3 chaos — nightly và bấm tay (kill/restart container hubv của CHÍNH runner, không đụng gì khác).
  chaos:
    name: chaos (L3)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERIFY_WITH_WEB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run verify:up
      - name: L3 chaos
        run: npm run verify:chaos
      - name: Log khi đỏ
        if: failure()
        run: docker compose -p hubv -f docker-compose.yml -f docker-compose.verify.yml --env-file .env.verify logs --no-color > hubv-logs.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-chaos
          path: |
            hubv-logs.txt
            verify/.results/
          if-no-files-found: ignore
          include-hidden-files: true # verify/.results là thư mục ẩn — thiếu cờ này artifact rỗng và không đọc được test nào skip/fail

  # M-5: probe tách job riêng — ~2 lượt jest/probe (đối chứng + phá), ~40 probe → 2–3 giờ trên runner; không phụ thuộc
  # chaos (chaos đỏ thì probe vẫn chạy). L1 probe cần Postgres/Redis của hubv nên vẫn verify:up.
  probe:
    name: probe (verify:probe --all)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VERIFY_JEST_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run verify:up
      - name: verify:probe --all (đối chứng xanh + phá thì đỏ ĐÚNG LÝ DO; INVALID = đỏ)
        run: npm run verify:probe -- --all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-probe
          path: verify/.results/
          if-no-files-found: ignore
          include-hidden-files: true # verify/.results là thư mục ẩn — thiếu cờ này artifact rỗng và không đọc được test nào skip/fail
