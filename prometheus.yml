global:
  scrape_interval: 5s

# S3-4: hub-api phục vụ /metrics qua Nest (cổng 4000); hub-worker qua http server tối giản (9101,
# chỉ trong mạng compose). Deployed: đặt METRICS_TOKEN và thêm bearer_token cho job hub-api.
scrape_configs:
  - job_name: 'hub-api'
    static_configs:
      - targets: ['hub-api:4000']
  - job_name: 'hub-worker'
    static_configs:
      - targets: ['hub-worker:9101']
